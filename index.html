<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>

        <style>
            body{
                font-family: 'Poppins', sans-serif;
            }

             #top-block{
            background-color: #4E5CBF;
            padding-left: 10px;
            padding-bottom: 10px;
           }

           h1{
            font-family: 'Poppins',sans-serif;

            color: white;
            
           }

           h3{
            font-family: 'Poppins',sans-serif;
           }

          #button{
            background-color: #6FCF97;
            border-radius: 5px;
          }

            li{
                cursor: pointer;
                margin-bottom: 5px;
            }

            .Completed{
                text-decoration: line-through;
                color: gray;
                cursor: pointer;
            }


        </style>
    </head>
    <body>
        <div id="top-block">
           <h1>To-do list</h1>
           <!-- <label for="taskinput" id="taskInputLabel">Enter new task:</label> -->
           <input type="text" id="taskInput" placeholder="Type new task here">
           <button  id="button" onclick="add_todo()"> Add Task</button>
           <p id="warning" style="color: red;"></p>
        </div>
        
        <div id="sub-block">
           <h3>All tasks</h3>
           <ul id="todoList"></ul>
        </div>

        <script src="app.js"></script>
    </body>
</html>
