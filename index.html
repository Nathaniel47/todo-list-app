<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do List</title>

        <style>
            body{
                font-family: 'Poppins', sans-serif;
            }

             #top-block{
            background-color: #4E5CBF;
            padding-left: 10px;
            padding-bottom: 10px;
           }

           h1{
            font-family: 'Poppins',sans-serif;

            color: white;
            
           }

           h3{
            font-family: 'Poppins',sans-serif;
           }

          #button{
            background-color: #6FCF97;
            border-radius: 5px;
          }

            li{
                cursor: pointer;
                margin-bottom: 5px;
            }

            .Completed{
                text-decoration: line-through;
                color: gray;
                cursor: pointer;
            }


        </style>
    </head>
    <body>
        <div id="top-block">
           <h1>To-do list</h1>
           <!-- <label for="taskinput" id="taskInputLabel">Enter new task:</label> -->
           <input type="text" id="taskInput" placeholder="Type new task here">
           <button  id="button" onclick="addTask()"> Add Task</button>
           <p id="warning" style="color: red;"></p>
        </div>
        
        <div id="sub-block">
           <h3>All tasks</h3>
           <ul id="taskList"></ul>
        </div>

        <script>
            function addTask(){

                //Get the input field
                const input = document.getElementById("taskInput")

                //Get warning paragraph
                const warning = document.getElementById("warning")


                // Get the name of the new task from the input field
                const newTask = input.value.trim();
                
                //Check if task enter is not empty
                if(newTask === ""){
                    warning.textContent = "Please enter task!" //Add warning
                    return; //Stop the function so that task doesn't get added 
                } else {
                    warning.textContent = "" // clear warning if input is ok
                }



                // Make the new task a list item
                const newListItem = document.createElement("li"); // create a  new list item
                newListItem.textContent = newTask; //Putting the new task in the new list item

                //Make the task clickable to be marked as completed
                newListItem.addEventListener("click", function () { newListItem.classList.toggle("Completed")
                })

                
                //Create the remove button
                removeBtn = document.createElement("button")
                removeBtn.textContent = "Remove"
                removeBtn.style.marginLeft = "10px";
                removeBtn.style.cursor = "pointer";

                //delete functionality of the delete button
                removeBtn.addEventListener("click", function (event){
                    event.stopPropagation(); //stops the click from triggering the task's click event
                    newListItem.remove(); // delete the task
                })

                //Add the delete button to the task
                newListItem.appendChild(removeBtn);

                //Get the List of tasks
                const taskList = document.getElementById("taskList");

                //Append the new task to the List of tasks
                taskList.appendChild(newListItem)

                //Clear the input field
                input.value = ""

            }
        </script>
    </body>
</html>
